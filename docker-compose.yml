# Minimal self-contained stack: MySQL 8 + goacos.
#   docker compose up -d
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: goacos_root   # change me
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-pgoacos_root"]
      interval: 5s
      timeout: 3s
      retries: 20

  goacos:
    build: .
    image: goacos:local
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      GOACOS_DB_TYPE: mysql             # or use docker-compose.postgres.yml
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DB: goacos
      MYSQL_USER: root
      MYSQL_PASSWORD: goacos_root        # change me
      # GOACOS_AUTH_ENABLED: "true"
      # GOACOS_AUTH_TOKEN_SECRET: "change-me-in-production"

      # Gateway data plane — off by default. Uncomment together with the
      # certificate volume below to serve declared domains.
      # GOACOS_GATEWAY_ENABLED: "true"
      # GOACOS_GATEWAY_HTTP_ADDR: ":80"
      # GOACOS_GATEWAY_HTTPS_ADDR: ":443"
      # GOACOS_GATEWAY_CERT_DIR: /etc/goacos/certs
      # GOACOS_GATEWAY_CERT_WRITE_BACK: "true"   # needs a writable mount
      # GOACOS_GATEWAY_ACME_EMAIL: ops@example.com
    volumes:
      # Shared certificate directory. Certificates already produced by certbot
      # or another CA tool can be dropped straight in:
      #   ./certs/example.com/fullchain.pem + privkey.pem   (certbot live layout)
      #   ./certs/example.com.crt          + example.com.key (flat pair)
      #   ./certs/example.com.pem                           (combined)
      # The container runs as uid 10001 — chown this directory to 10001, or the
      # gateway will load nothing from it.
      # - ./certs:/etc/goacos/certs
    ports:
      - "8848:8848"
      # - "80:80"     # gateway HTTP  (ACME challenges + redirect)
      # - "443:443"   # gateway HTTPS (real traffic)

volumes:
  mysql-data:
