# Minimal self-contained stack: MySQL 8 + goacos.
#   docker compose up -d
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: goacos_root   # change me
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-pgoacos_root"]
      interval: 5s
      timeout: 3s
      retries: 20

  goacos:
    build: .
    image: goacos:local
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DB: goacos
      MYSQL_USER: root
      MYSQL_PASSWORD: goacos_root        # change me
      # GOACOS_AUTH_ENABLED: "true"
      # GOACOS_AUTH_TOKEN_SECRET: "change-me-in-production"
    ports:
      - "8848:8848"

volumes:
  mysql-data:
